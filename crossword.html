<!DOCTYPE html>
<html>
    <head>
        <title>Crossword</title>
        <link rel="styleSheet" href="wordsearch.css">
        <link rel="styleSheet" href="crossword.css">
    </head>
    <body>
        <header>
            <h1>Crossword Generator</h1>
            <a href="index.html">Wordsearch</a>
        </header>
        <main>
            <div class="options">
                <div class="inputs">
                    <label for="title">
                        Title
                    </label>
                    <input  type="text"
                            id="title"
                            name="title"
                            maxlength = "50"
                            placeholder="Enter a title...">
                    <label for="words">
                        Words
                    </label>        
                    <textarea   id="words"   
                                name="words" 
                                rows="10" 
                                cols="30" 
                                maxlength="400" 
                                placeholder="e.g. cow&#10dog&#10horse"></textarea>
                <button name="submit">Generate</button>
                <button name="print">Print</button>                
                </div>
            </div>   
            <div class="canvas">
                <canvas></canvas>
            </div>
            <script src="crossword.js"></script>
        </main>
    </body>
</html>
