<!DOCTYPE html>
<head>
    <title>Wordsearch</title>
    <link rel="stylesheet" href="wordsearch.css">
</head>
<body>
    <header>
        <h1>Wordsearch Generator</h1>
        <a href="crossword.html">crossword</a>
    </header>
    <main>
        <div class="options">
            <div class="inputs">
                <label for="title">
                    Title
                </label>
                <input  type="text"
                        placeholder="Enter a title..."
                        id="title"
                        name="title"
                        maxlength = "50">
                <label for="words">
                    Words
                </label>        
                <textarea   id="words"   
                            name="words" 
                            rows="10" 
                            cols="30" 
                            maxlength="400" 
                            placeholder="e.g. cow&#10dog&#10horse"></textarea>
                <label for="Grid Size">
                    Grid Size 
                </label> 
                <input name="Grid Size" type="number" value="10">
                <label for="wordDirection">
                    Word Direction  
                </label> 
                <fieldset class="wordDirection" name="wordDirection">
                    <div class="directionBox"><i class="arrow right"></i><input name="forwards" type="checkbox" checked></div>
                    <div class="directionBox"><i class="arrow rightDown"></i><input name="forwards down" type="checkbox" checked></div>
                    <div class="directionBox"><i class="arrow down"></i><input name="down" type="checkbox" checked></div>
                    <div class="directionBox"><i class="arrow leftDown"></i><input name="backwards down" type="checkbox"></div>
                    <div class="directionBox"><i class="arrow left"></i><input name="backwards" type="checkbox"></div>
                    <div class="directionBox"><i class="arrow leftUp"></i><input name="backwards up" type="checkbox"></div>
                    <div class="directionBox"><i class="arrow up"></i><input name="up" type="checkbox"></div>
                    <div class="directionBox"><i class="arrow rightUp"></i><input name="forwards up" type="checkbox" checked></div>
                </fieldset>
                <button name="submit" onclick="getInputs">Generate</button>
                <button name="print">Print</button>
            </div>
        </div>
        <div class="canvas">
            <canvas></canvas>
        </div>
        <script src="wordsearch.js"></script>
    </main>
</body>
